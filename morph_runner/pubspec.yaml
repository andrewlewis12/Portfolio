name: morph_runner
description: Master the art of timing and transformation in this fast-paced, shape-shifting endless runner!

publish_to: 'none'

version: 1.1.3+14

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.5.3
  google_mobile_ads: ^6.0.0
  url_launcher: ^6.3.2
  flutter_soloud: ^2.0.0
  cloud_firestore: ^5.6.12
  share_plus: ^11.0.0
  firebase_database: ^11.3.10
  font_awesome_flutter: 10.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/morph_runner_background.png
    - assets/morph_runner_foreground.png
    - assets/sounds/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/morph_runner_foreground.png"
  adaptive_icon_background: "assets/morph_runner_background.png"
  adaptive_icon_foreground: "assets/morph_runner_foreground.png"
  android_icon_name: "ic_launcher"
  remove_alpha_ios: true
