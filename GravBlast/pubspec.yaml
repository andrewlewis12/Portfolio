name: grav_blast
description: A futuristic puzzle game where gravity meets explosive block-clearing action.
version: 1.1.4+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_mobile_ads: ^5.0.0
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  provider: ^6.1.1
  flutter_soloud: ^3.2.2
  url_launcher: ^6.3.2
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/music/

  fonts:
    - family: GameFont
      fonts:
        - asset: assets/fonts/game_font.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png  # For non-adaptive icons (fallback)

  adaptive_icon_background: assets/ic_launcher_background.png  # Use solid or gradient image here
  adaptive_icon_foreground: assets/ic_launcher_foreground.png  # Transparent logo / symbol
